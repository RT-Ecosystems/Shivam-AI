workflows:
  android-build:
    name: Shivam AI - Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - api_keys
      vars:
        EXPO_PUBLIC_GROQ_API_KEY: $GROQ_API_KEY
      node: 20.0.0
      java: 17

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - ./node_modules

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate android folder)
        script: |
          npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_GROQ_API_KEY: $GROQ_API_KEY

      - name: Set API key in gradle
        script: |
          echo "EXPO_PUBLIC_GROQ_API_KEY=$GROQ_API_KEY" >> android/gradle.properties

      - name: Make gradlew executable
        script: |
          chmod +x android/gradlew

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g"

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
          
