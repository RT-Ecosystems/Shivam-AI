# Shivam AI - Codemagic Android APK Build
workflows:
  android-build:
    name: Android APK Build
    instance_type: mac_mini_m2          # ← यही बदलाव किया है
    max_build_duration: 45
    environment:
      groups:
        - api_keys
      vars:
        EXPO_PUBLIC_GROQ_API_KEY: $EXPO_PUBLIC_GROQ_API_KEY
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.expo
        - ./node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm ci --prefer-offline

      - name: EAS Build
        script: |
          echo "🚀 Starting EAS Android Build..."
          npx eas build --platform android \
                        --profile preview \
                        --non-interactive

    artifacts:
      - build/**/*.apk
      - $HOME/.eas/build/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com     # अपना ईमेल डाल दो
        notify:
          success: true
          failure: true
