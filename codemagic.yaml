# Shivam AI - Codemagic Android Build (Final Fixed)
workflows:
  android-build:
    name: Android APK Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - api_keys
      vars:
        EXPO_PUBLIC_GROQ_API_KEY: $EXPO_PUBLIC_GROQ_API_KEY
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.expo
        - ./node_modules
    scripts:
      - name: Clean Cache & Install dependencies
        script: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps --prefer-offline

      - name: Install Expo Tools
        script: |
          npx expo install expo-updates --fix

      - name: Build Android APK
        script: |
          echo "🚀 Starting EAS Build..."
          npx eas build --platform android \
                        --profile preview \
                        --non-interactive

    artifacts:
      - build/**/*.apk
      - $HOME/.eas/build/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
